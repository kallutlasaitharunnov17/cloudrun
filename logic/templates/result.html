<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculation Result</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #eef2ff 0%, #f8fafc 45%, #f1f5f9 100%);
            font-family: Inter, system-ui, sans-serif;
            color: #0f172a;
        }
        .card {
            width: min(540px, 92vw);
            background: rgba(255,255,255,0.98);
            border-radius: 34px;
            border: 1px solid rgba(148,163,184,0.18);
            box-shadow: 0 28px 90px rgba(15,23,42,0.14);
            padding: 40px 36px;
            text-align: center;
        }
        .heading {
            margin: 0 0 12px;
            font-size: 2.15rem;
            letter-spacing: -0.04em;
            color: #111827;
        }
        .subtitle {
            margin: 0 0 26px;
            color: #475569;
            font-size: 1rem;
            line-height: 1.75;
        }
        .result-grid {
            display: grid;
            gap: 16px;
            margin-top: 20px;
        }
        .result-card {
            background: #eff6ff;
            border-radius: 24px;
            border: 1px solid #bfdbfe;
            padding: 24px;
            text-align: left;
        }
        .result-card strong {
            display: block;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #1d4ed8;
            letter-spacing: 0.02em;
        }
        .result-card .value {
            margin: 0;
            font-size: 2.6rem;
            color: #1e40af;
            font-weight: 800;
        }
        .button-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
            padding: 14px 24px;
            border-radius: 18px;
            border: none;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(37,99,235,0.18);
        }
        .button-primary { background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); }
        .button-secondary { background: #475569; }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="heading">Calculation Result</h1>
        <p class="subtitle">Your rectangle metrics are ready. Use the buttons below to recalculate or return to the login screen.</p>
        <div class="result-grid">
            <div class="result-card">
                <strong>Area</strong>
                <p class="value">{{ area }}</p>
            </div>
            <div class="result-card">
                <strong>Perimeter</strong>
                <p class="value">{{ perimeter }}</p>
            </div>
        </div>
        <div class="button-row">
            <a href="/home" class="button button-secondary">Back</a>
            <a href="/logout" class="button button-primary">Logout</a>
        </div>
    </div>
</body>
</html>
