<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top left, #e0f2fe 0%, #f8fafc 45%, #e2e8f0 100%);
            font-family: Inter, system-ui, sans-serif;
            color: #0f172a;
        }
        .calculator {
            width: min(460px, 94vw);
            background: rgba(255,255,255,0.98);
            border-radius: 36px;
            border: 1px solid rgba(148,163,184,0.18);
            box-shadow: 0 30px 90px rgba(15,23,42,0.12);
            padding: 32px;
            box-sizing: border-box;
        }
        .topbar {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 28px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(37,99,235,0.12);
            color: #1e3a8a;
            font-size: 0.85rem;
            font-weight: 700;
        }
        .title {
            flex: 1;
            text-align: right;
        }
        h1 {
            margin: 0;
            font-size: 2.1rem;
            letter-spacing: -0.04em;
            color: #0f172a;
        }
        .subtitle {
            margin: 8px 0 0;
            color: #475569;
            font-size: 0.96rem;
            line-height: 1.6;
        }
        .screen {
            margin: 0 auto 20px;
            padding: 22px 24px;
            border-radius: 24px;
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            border: 1px solid rgba(148,163,184,0.24);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55);
        }
        .field {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: #334155;
        }
        input {
            box-sizing: border-box;
            width: 100%;
            max-width: 100%;
            border: 1px solid #cbd5e1;
            border-radius: 16px;
            padding: 16px 18px;
            font-size: 1rem;
            color: #0f172a;
            background: #f8fafc;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 8px rgba(37,99,235,0.12);
        }
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin: 18px 0 22px;
        }
        .key {
            border: none;
            border-radius: 18px;
            padding: 18px 0;
            font-size: 1.1rem;
            font-weight: 700;
            background: #f8fafc;
            color: #0f172a;
            box-shadow: 0 12px 24px rgba(15,23,42,0.06);
            cursor: pointer;
            transition: transform 0.18s ease, background 0.18s ease;
        }
        .key:active {
            transform: translateY(1px);
            background: #e0f2fe;
        }
        .key.clear {
            background: #fca5a5;
            color: #7f1d1d;
        }
        .key.zero {
            grid-column: span 2;
        }
        .submit-row {
            margin-top: 16px;
        }
        .submit-button {
            width: 100%;
            border: none;
            border-radius: 18px;
            padding: 16px 0;
            font-size: 1rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 30px rgba(37,99,235,0.22);
        }
        .message {
            margin-bottom: 18px;
            color: #dc2626;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="topbar">
            <div class="title">
                <h1>Calculator Login</h1>
                <p class="subtitle">Sign in to continue to the rectangle calculator.</p>
            </div>
        </div>

        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}

        <form method="POST" action="/login">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <div class="submit-row">
                <button type="submit" class="submit-button">Login</button>
            </div>
        </form>
    </div>
</body>
</html>
