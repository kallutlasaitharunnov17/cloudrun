<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top left, #e0f2fe 0%, #f8fafc 45%, #e2e8f0 100%);
            font-family: Inter, system-ui, sans-serif;
            color: #0f172a;
        }
        .calculator {
            width: min(520px, 94vw);
            background: rgba(255,255,255,0.98);
            border-radius: 36px;
            border: 1px solid rgba(148,163,184,0.18);
            box-shadow: 0 32px 90px rgba(15,23,42,0.12);
            padding: 32px;
        }
        .topbar {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            margin-bottom: 24px;
            gap: 12px;
        }
        .title {
            text-align: right;
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.04em;
            color: #0f172a;
        }
        .subtitle {
            margin: 8px 0 0;
            color: #475569;
            font-size: 0.96rem;
            line-height: 1.6;
        }
        .display {
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
            border: 1px solid rgba(148,163,184,0.24);
            border-radius: 28px;
            padding: 24px;
            margin-bottom: 26px;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
        }
        .display p {
            margin: 0;
            font-size: 0.95rem;
            color: #475569;
        }
        .result-value {
            margin: 14px 0 0;
            font-size: 3rem;
            font-weight: 800;
            color: #1d4ed8;
            letter-spacing: -0.03em;
            line-height: 1;
            word-break: break-all;
        }
        .result-grid {
            display: grid;
            gap: 16px;
        }
        .result-card {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1e3a8a;
            padding: 22px;
            border-radius: 22px;
        }
        .result-card strong {
            display: block;
            margin-bottom: 10px;
            color: #1d4ed8;
            font-size: 1rem;
        }
        .button-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        .button-row a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
            padding: 14px 22px;
            border-radius: 18px;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }
        .button-row a:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(37,99,235,0.18);
        }
        .button-primary { background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); }
        .button-secondary { background: #475569; }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="topbar">
            <div class="title">
                <h1>Calculation Result</h1>
                <p class="subtitle">The rectangle calculator shows the selected output and the full breakdown.</p>
            </div>
        </div>
        <div class="display">
            <p>Selected Mode</p>
            <p class="result-value">{{ operation|capitalize }}</p>
        </div>
        <div class="result-grid">
            {% if operation == 'both' %}
                <div class="result-card">
                    <strong>Area</strong>
                    <p class="result-value">{{ area }}</p>
                </div>
                <div class="result-card">
                    <strong>Perimeter</strong>
                    <p class="result-value">{{ perimeter }}</p>
                </div>
            {% else %}
                <div class="result-card">
                    <strong>Answer</strong>
                    <p class="result-value">{{ result }}</p>
                </div>
            {% endif %}
        </div>
        <div class="button-row">
            <a href="/home" class="button-secondary">Back</a>
            <a href="/logout" class="button-primary">Logout</a>
        </div>
    </div>
</body>
</html>
