<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #eef2ff 0%, #f8fafc 45%, #f1f5f9 100%);
            font-family: Inter, system-ui, sans-serif;
            color: #0f172a;
        }
        .card {
            width: min(440px, 90vw);
            background: rgba(255,255,255,0.98);
            border-radius: 28px;
            border: 1px solid rgba(148,163,184,0.2);
            box-shadow: 0 24px 60px rgba(15,23,42,0.08);
            padding: 40px 32px;
            text-align: center;
            box-sizing: border-box;
        }
        .badge {
            display: inline-flex;
            padding: 8px 16px;
            border-radius: 999px;
            background: rgba(59,130,246,0.12);
            color: #1d4ed8;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 8px;
            font-size: 2.2rem;
            letter-spacing: -0.03em;
            color: #111827;
        }
        .subtitle {
            margin: 0 0 32px;
            color: #64748b;
            font-size: 1rem;
            line-height: 1.5;
        }
        .field {
            margin-bottom: 20px;
            text-align: left;
        }
        .field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 0.95rem;
        }
        .field input {
            box-sizing: border-box;
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            border: 2px solid #e2e8f0;
            background: #f8fafc;
            font-size: 1.05rem;
            color: #0f172a;
            transition: all 0.2s ease;
        }
        .field input:focus {
            outline: none;
            border-color: #3b82f6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59,130,246,0.15);
        }
        button {
            width: 100%;
            padding: 18px 0;
            margin-top: 10px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(37,99,235,0.25);
        }
        .message {
            margin-bottom: 24px;
            padding: 12px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 12px;
            color: #dc2626;
            font-weight: 600;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">Secure Access</span>
        <h1>Login</h1>
        <p class="subtitle">Sign in to use the rectangle calculator.</p>
        
        {% if message %}
            <div class="message">{{ message }}</div>
        {% endif %}
        
        <form method="POST" action="/login">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" type="text" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
