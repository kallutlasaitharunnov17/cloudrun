<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #eef2ff 0%, #fff7ed 100%);
            font-family: Inter, system-ui, sans-serif;
            color: #0f172a;
        }
        .card {
            width: min(420px, 90vw);
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
            padding: 36px;
            text-align: center;
        }
        h2 {
            margin: 0 0 18px;
            font-size: 2rem;
        }
        .field {
            margin-bottom: 18px;
            text-align: left;
        }
        .field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
        }
        .field input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 6px rgba(99, 102, 241, 0.12);
        }
        button {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 14px;
            background: #4f46e5;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(79, 70, 229, 0.2);
        }
        .message {
            margin-bottom: 18px;
            color: #dc2626;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        {% if message %}
            <p class="message">{{ message }}</p>
        {% endif %}
        <form method="POST" action="/login">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" name="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
